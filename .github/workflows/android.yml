name: Android CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, invariant fuzzing and balance simulation
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK, release APK and release AAB
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk       dist/Emberdeep-debug.apk
          cp app/build/outputs/apk/release/app-release.apk   dist/Emberdeep-release.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/Emberdeep-release.aab
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emberdeep-builds
          path: dist/*

      - name: Commit built APK/AAB back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          if git diff --cached --quiet; then
            echo "No build output changes."
          else
            git commit -m "ci: update built APK/AAB [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
